<title>Barretos — Carrossel Agrum Jornal · Tela 1</title>

<style>
/* ------------------------------------------------------------------
   Fontes originais, extraidas do PDF exportado do Canva.
   Os subsets contem exatamente os glifos usados nesta tela.
   Nenhuma tabela kern/GPOS (o PDF ja posiciona glifo a glifo),
   por isso font-kerning: none deixa o resultado deterministico.
   ------------------------------------------------------------------ */
@font-face {
  font-family: "Anicon Sans";
  src: url("fonts/AniconSans-Regular.woff2") format("woff2");
  font-weight: 400; font-style: normal; font-display: block;
}
@font-face {
  font-family: "NYT Franklin";
  src: url("fonts/NYTFranklin-Light.woff2") format("woff2");
  font-weight: 300; font-style: normal; font-display: block;
}
@font-face {
  font-family: "NYT Franklin";
  src: url("fonts/NYTFranklin-Semibold.woff2") format("woff2");
  font-weight: 600; font-style: normal; font-display: block;
}
@font-face {
  font-family: "NYT Franklin";
  src: url("fonts/NYTFranklin-Bold.woff2") format("woff2");
  font-weight: 700; font-style: normal; font-display: block;
}

:root {
  --green: #4ADC75;
  --dark:  #002820;
}

html { background: #0b0f0d; }
body { margin: 0; display: grid; place-items: start center; }

/* A prancheta tem exatamente 1080x1440 px, como no Canva.
   O escalonamento so entra em telas menores, para nao afetar a medicao. */
.stage {
  width: 1080px; height: 1440px;
  transform-origin: top center;
}
@media (max-width: 1079px) {
  .stage { transform: scale(calc(100vw / 1080)); }
  body { height: calc(1440 * (100vw / 1080)); }
}

.page {
  position: relative;
  width: 1080px; height: 1440px;
  overflow: hidden;
  background: #FFFFFF;            /* L01 — base da pagina */
  font-kerning: none;
  font-variant-ligatures: none;
  text-rendering: geometricPrecision;
  -webkit-font-smoothing: antialiased;
}
.page > * { position: absolute; }
.page img { display: block; }

/* L02 — cor de fundo da marca */
.l02-bg { inset: 0; background: var(--dark); }

/* L03 — foto de fundo (arena Barretos) */
.l03-bg {
  left: -54.0483px; top: -144.1289px;
  width: 1188px; height: 1584px;
}

/* L04 / L06 — molduras circulares (a foto e cortada pelo circulo) */
.frame { border-radius: 50%; overflow: hidden; }
.frame > img { position: absolute; }

.l04-circle1 {
  left: 65.6705px; top: 271.8295px;
  width: 334.1593px; height: 334.1593px;
}
.l04-circle1 > img {
  left: -201.4069px; top: -145.6561px;
  width: 609.5797px; height: 760.9957px;
}

.l06-circle2 {
  left: 699.9199px; top: 455.0609px;
  width: 334.1593px; height: 334.1593px;
}
.l06-circle2 > img {
  left: -294.2308px; top: -282.2345px;
  width: 937.2125px; height: 1172.1683px;
}

/* L05 / L07 — anel verde.
   No PDF e um traco de 8px centrado no circulo, mas clipado pelo proprio
   circulo: so a metade de dentro aparece. Logo, borda interna de 4px. */
.ring {
  border-radius: 50%;
  border: 4px solid var(--green);
  box-sizing: border-box;
}
.l05-ring1 {
  left: 65.6705px; top: 271.8295px;
  width: 334.1593px; height: 334.1593px;
}
.l07-ring2 {
  left: 699.9199px; top: 455.0609px;
  width: 334.1593px; height: 334.1593px;
}

/* L08 — recorte da modelo (PNG transparente, mesma geometria da L03) */
.l08-cutout {
  left: -54.0483px; top: -144.1289px;
  width: 1188px; height: 1584px;
}

/* L09 — degrade preto->transparente, espelhado na vertical (escala Y positiva no PDF) */
.l09-scrim {
  left: -497.7744px; top: 580.6533px;
  width: 2075.9998px; height: 892px;
  transform: scaleY(-1);
}

/* L10 — assinatura "AGRUM JORNAL" */
.l10-wordmark {
  left: 108px; top: 111.913px;
  font-family: "Anicon Sans", sans-serif;
  font-weight: 400;
  font-size: 99.9916px;
  line-height: 111.4906px;
  color: #FFFFFF;
  white-space: pre;
}

/* L11 — etiqueta verde (retangulo reto, sem raio) */
.l11-pill {
  left: 108px; top: 989.8893px;
  width: 249.3633px; height: 58.9694px;
  background: var(--green);
  border-radius: 0px;
}

/* L12 — categoria "NEGOCIOS" */
.l12-kicker {
  left: 124.9981px; top: 1001.5617px;
  font-family: "NYT Franklin", sans-serif;
  font-weight: 600;
  font-size: 35.46px;
  line-height: 35.46px;
  letter-spacing: 5.8466px;
  color: var(--dark);
  white-space: pre;
}

/* L13 — manchete.
   As tres linhas sao explicitas: o PDF fixa as baselines em
   1155.0348 / 1237.0348 / 1319.0348 px,
   espacadas de exatamente 82px. */
.l13-headline {
  left: 108px; top: 1081.5548px;
  width: 864px;
  font-family: "NYT Franklin", sans-serif;
  font-weight: 300;
  font-size: 73.91px;
  line-height: 82px;
  color: #FFFFFF;
  white-space: pre-wrap;
}
.l13-headline b { font-weight: 700; }
.l13-headline .g { color: var(--green); }
</style>

  <div class="page">
    <div class="l02-bg"></div>

    </div>

  </div>
</div>
